name: Deploy React App to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --include=optional
          npm install -D @rolldown/binding-linux-x64-gnu || true

      - name: Run build check
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/React-test

            # Reset local repository state cleanly to origin/main
            git fetch origin main
            git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd

            # Rebuild docker image
            docker build -t my-react-app .

            # Stop and remove existing container
            docker stop react-container || true
            docker rm react-container || true

            # Run container on internal port 3000
            docker run -d --name react-container \
              -p 127.0.0.1:3000:3000 \
              --restart unless-stopped my-react-app

            # Clean up old images
            docker image prune -f
