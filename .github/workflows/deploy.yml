name: Deploy React App to EC2

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting with Prettier
        run: npm run format:check

      - name: Run TypeScript build check
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/React-test

            # Pull latest changes from git
            git pull origin main

            # Rebuild the Docker image natively on ARM64
            docker build --no-cache -t my-react-app .

            # Stop and remove the old running container
            docker stop react-container || true
            docker rm react-container || true

            # Start the new container
            docker run -d --name react-container -p 80:80 --restart unless-stopped my-react-app

            # Clean up dangling/unused images to save disk space
            docker image prune -f