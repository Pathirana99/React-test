name: Deploy React App to EC2

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting with Prettier
        run: npm run format:check

      - name: Run TypeScript build check
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/React-test

            # Pull latest code
            git pull origin main
            git fetch --tags

            # Get the current version tag from git (clean tag name)
            export APP_VERSION=$(git describe --tags --abbrev=0 --always)

            # Rebuild image
            docker build --build-arg VITE_APP_VERSION=$APP_VERSION -t my-react-app .

            # Stop and remove existing container
            docker stop react-container || true
            docker rm react-container || true

            # Run container on internal port 3000 (proxied by host Nginx)
            docker run -d --name react-container -p 127.0.0.1:3000:80 --restart unless-stopped my-react-app

            # Clean up old images
            docker image prune -f
