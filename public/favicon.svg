<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#050e1d" stroke="url(#neonRim)" stroke-width="2.5" />
  <!-- Stylized "S" Monogram for Sunith -->
  <path d="M 41 21 C 41 16 37 13 32 13 C 25 13 21 17.5 21 23 C 21 31.5 43 28.5 43 41 C 43 47.5 37.5 51 32 51 C 25 51 21 46.5 21 41" 
        fill="none" 
        stroke="url(#sGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
  <!-- Live Neon Green Dot -->
  <circle cx="45" cy="17" r="2.5" fill="#22c55e" />
</svg>
